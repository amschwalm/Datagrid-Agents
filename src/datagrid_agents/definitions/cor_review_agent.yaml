name: Micron COR Review Agent
description: >-
  Owner-side, Procore-only first-pass review of Change Order Requests, graded on cost,
  schedule, and technical (scope) criteria and delivered as a branded HTML report.
agent_model: magpie-2.5
tools:
  - semantic_search
  - pdf_extraction
  - pdf_page_info
  - data_extraction
  - data_analysis
  - calculate
knowledge_env: CONSTRUCTION_KNOWLEDGE_IDS

# Prompts live as markdown next to the report template so the render contract
# cannot drift from the shipped HTML. `{{include: ...}}` inlines the template.
system_prompt_file: prompts/cor_review_agent/system.md
planning_prompt_file: prompts/cor_review_agent/planning.md
custom_prompt_file: prompts/cor_review_agent/custom.md

sample_prompt: |
  Review the attached COR 006 R3 from PVJV Mechanical on commitment SC-04220-MECH
  (Sub-Fab L3 chilled water header reroute, $1,124,653.75). The package includes
  timesheets, vendor quotes, and a claimed 55-day schedule impact. Produce the
  COR Review Report.
